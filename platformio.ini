; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── ESP32-S3 firmware (Freenove FNK0104N, 3.5-inch display) ─────────────────
; The Freenove display library bundles LVGL 8.4.0 and its own lv_conf.h.
; Do NOT add lvgl/lvgl here — it would conflict with the bundled version.
; When the Freenove library is confirmed, add it under lib_deps below.
[env:freenove_esp32_s3_wroom]
platform  = espressif32
board     = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
build_flags =
    -D UI_TARGET_ESP32=1
    -D LV_CONF_INCLUDE_SIMPLE

; lib_deps =
;     <Freenove display library once confirmed>
;     lvgl/lvgl @ 8.4.0   ; only if NOT provided by the Freenove library
