; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = freenove_display

[env:freenove_display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps = 
	lvgl/lvgl@8.4.0
	fastled/FastLED@^3.10.3
	adafruit/Adafruit NeoPixel@^1.15.5
	robtillaart/PCF8575  ; no I2C expander
	bblanchon/ArduinoJson
	knolleary/PubSubClient

build_unflags = 
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=0
	-DLV_CONF_INCLUDE_SIMPLE
	; lv_conf.h lives in include/, make it visible to LVGL's own compilation units.
	-Iinclude
	-D SMART_CABINET_ENABLE_ENCODER=1
	-D SMART_CABINET_ENABLE_PWM_CABINET_LIGHT=1
	; Expose the lvgl/ package name for #include "lvgl/lvgl.h" style includes.
	-I.pio/libdeps/freenove_display
	; Allow IntelliSense to resolve intra-UI includes (ui.h, ui_helpers.h, etc.)
	-Isrc/ui
extra_scripts = pre:extra_script.py
monitor_filters = 
	esp32_exception_decoder
